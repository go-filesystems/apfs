name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Native runners: build + race + coverage on the two architectures
  # GitHub hosts directly.
  native:
    name: ${{ matrix.arch }} (native)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Native runners get the FULL suite (heavy multi-level B-tree
      # builders included) under the race detector + coverage. The
      # heaviest cases push total runtime past Go's default 10m
      # `go test` timeout; under the race detector on the hosted arm64
      # runner the full suite needs more than 30m (it timed out right at
      # the 30m wall having already reached ~79% coverage), so raise
      # -timeout to 60m for comfortable headroom. This is the
      # authoritative correctness + coverage gate.
      - name: Test (race + coverage, full suite)
        run: |
          go test -race -timeout 60m -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.arch }}
          path: cover.out
          if-no-files-found: ignore

  # Emulated runners: cross-compile per-package test binaries on the
  # amd64 host (CGO disabled) and run each under QEMU via docker.
  #
  # QEMU user-mode emulation is ~10-50x slower than native, so the
  # heaviest multi-level B-tree / large-volume builders (which already
  # push native arm64 past the default 10m `go test` timeout) are
  # gated behind testing.Short() in the test sources. These jobs run
  # with `-test.short`, so they genuinely execute + pass the core
  # suite on every arch — proving the architecture works end-to-end,
  # including s390x exercising the little-endian APFS on-disk codec
  # from a big-endian host — while skipping the pathologically slow
  # cases. `-test.timeout=30m` gives the remaining tests headroom
  # under emulation. Full-suite correctness + the coverage gate live
  # on the native jobs above.
  emulated:
    name: ${{ matrix.arch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: "rv64,v=true,vlen=128"
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: "la464"
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: "power9"
          - arch: s390x
            image: debian:trixie
            qemu_cpu: "qemu"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Register QEMU binfmt handlers
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Cross-compile per-package test binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p _testbins
          for pkg in $(go list ./...); do
            # Skip packages without test files (go test -c emits nothing).
            if [ -z "$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}yes{{end}}' "$pkg")" ]; then
              continue
            fi
            name="$(echo "$pkg" | tr '/.' '__')"
            go test -c -cover -o "_testbins/${name}.test" "$pkg"
          done
          ls -l _testbins

      # Run under QEMU with -test.short (skip the heavy builders) and a
      # generous -test.timeout so emulation latency never trips the
      # default 10m test-binary timeout.
      - name: Run test binaries under QEMU (-short)
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(_testbins/*.test)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "no test binaries to run"
            exit 0
          fi
          for bin in "${bins[@]}"; do
            echo "::group::run ${bin} on ${{ matrix.arch }}"
            docker run --rm \
              --platform "linux/${{ matrix.arch }}" \
              -e QEMU_CPU="${{ matrix.qemu_cpu }}" \
              -v "$PWD:/work" -w /work \
              "${{ matrix.image }}" \
              "/work/${bin}" -test.v -test.short -test.timeout=30m
            echo "::endgroup::"
          done
